[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "granite-switch-mlx"
version = "0.1.0"
description = "IBM Granite Switch 4.1 (chat + decision + guardian adapters) on Apple Silicon (MLX)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["mlx>=0.32", "mlx-lm>=0.32", "transformers>=5.16", "huggingface_hub"]

[tool.setuptools]
packages = ["granite_switch_mlx"]
